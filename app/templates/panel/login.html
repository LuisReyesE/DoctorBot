{% extends "panel/base.html" %}
{% block title %}Ingresar{% endblock %}
{% block login %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Doctor Bot Panel</h1>
    <p>Gestión centralizada de consultas, médicos y pagos. No es la app del paciente.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/panel/login">
      <label for="token">Token de acceso</label>
      <input id="token" name="token" type="password" placeholder="Token (dev: admin)" required autofocus />
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p class="muted" style="margin-top:1rem;font-size:0.85rem">
      Configura <code>PANEL_TOKEN</code> en <code>.env</code>.
    </p>
  </div>
</div>
{% endblock %}
